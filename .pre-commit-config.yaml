repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --extra dev ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: Python type check
        entry: uv run --locked --extra dev pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
