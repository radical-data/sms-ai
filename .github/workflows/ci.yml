name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked pyright
      - name: Tests
        run: uv run --locked pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build production image
        run: docker build --tag sms-ai:ci .
      - name: Check application startup and demo page
        run: |
          docker run --detach --name sms-ai-ci --publish 8000:8000 sms-ai:ci
          trap 'docker logs sms-ai-ci; docker rm --force sms-ai-ci' EXIT
          # Docker can reset connections before Uvicorn starts listening.
          curl --fail --silent --show-error --output /dev/null \
            --retry 15 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            --connect-timeout 2 --max-time 5 http://localhost:8000/
